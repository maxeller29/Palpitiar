name: 🎨 Gerar Artigos Palpitiar

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  gerar-artigos:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🤖 Gerar 3 artigos com Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/gerar-artigos.js

      - name: ⚙️ Configurar Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: 💾 Commit dos artigos
        run: |
          if git diff --quiet; then
            echo "Nenhuma mudança para fazer commit"
          else
            git add blog.html sitemap.xml blog/artigo-*.html
            git commit -m "🎨 Artigos gerados automaticamente - $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: ✅ Sucesso!
        run: echo "Artigos gerados e publicados com sucesso!"
